name: citychina-local

services:
  oracle:
    build:
      context: .
      dockerfile: docker/oracle/Dockerfile
      args:
        ORACLE_BASE_IMAGE: ${ORACLE_BASE_IMAGE:-gvenzl/oracle-xe:21-slim}
    image: citychina-oracle:local
    container_name: citychina-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-citychina_dev_password}
      APP_USER: ${ORACLE_APP_USER:-CHINA}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-citychina_dev_password}
    ports:
      - "${ORACLE_HOST_PORT:-1522}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle-init:/container-entrypoint-initdb.d:ro
      - "./China CRUD.sql:/opt/oracle/scripts/setup/010_schema.sql:ro"
      - ./deploy/migrations/2026-04-13_password_reset.sql:/opt/oracle/scripts/setup/020_password_reset.sql:ro
      - ./deploy/migrations/2026-04-14_add_servico_frete.sql:/opt/oracle/scripts/setup/030_add_servico_frete.sql:ro
      - ./deploy/migrations/2026-04-15_drop_modalidade_tb_frete.sql:/opt/oracle/scripts/setup/040_drop_modalidade_tb_frete.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s system/$${ORACLE_PASSWORD}@//localhost:1521/XEPDB1 | grep -q 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citychina-backend
    environment:
      ORACLE_USER: ${ORACLE_APP_USER:-CHINA}
      ORACLE_PASSWORD: ${ORACLE_APP_PASSWORD:-citychina_dev_password}
      ORACLE_DSN: ${ORACLE_DSN:-oracle:1521/XEPDB1}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_jwt_secret_key_for_local_docker_123456}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      JWT_EXTENSION_TOKEN_EXPIRE_MINUTES: ${JWT_EXTENSION_TOKEN_EXPIRE_MINUTES:-120}
      JWT_ISSUER: ${JWT_ISSUER:-citychina-api-local}
      JWT_EXTENSION_AUDIENCE: ${JWT_EXTENSION_AUDIENCE:-citychina-extension}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      ENABLE_NGROK: ${ENABLE_NGROK:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "8050:8050"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8050/', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citychina-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  oracle-data:
